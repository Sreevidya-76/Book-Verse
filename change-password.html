<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Change Password — Book Verse</title><link rel="stylesheet" href="/css/style.css" /><link rel="stylesheet" href="/css/auth.css" /><link rel="stylesheet" href="/css/responsive.css" /></head><body><div data-header></div><main class="auth-wrap"><aside class="auth-aside"><a href="index.html" class="logo"><span class="logo-mark">📖</span><span>Book Verse</span></a><div><h2>Choose a new password.</h2><p>Create a fresh password to get back to your personal library.</p></div><div class="auth-foot">Demo authentication flow</div></aside><section class="auth-main"><div class="auth-card"><h1>Change password</h1><p class="sub">Set a new password for your Book Verse account.</p><form id="changePasswordForm" novalidate><div class="field"><label for="password">New password</label><input type="password" id="password" name="password" autocomplete="new-password" required /><div class="error-msg"></div></div><div class="field"><label for="confirm">Confirm new password</label><input type="password" id="confirm" name="confirm" autocomplete="new-password" required /><div class="error-msg"></div></div><button type="submit" class="btn btn-block btn-lg">Change password</button></form><p class="alt-link"><a href="login.html">Back to login</a></p></div></section></main><div data-footer></div><script src="/js/app.js"></script><script src="/js/auth.js"></script></body></html>
